<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Noto+Serif+JP:wght@700&family=Inter:wght@500;600&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    background:#13213D;
    position:relative;
    font-family:'Inter',sans-serif;
    color:#EAEDF2;
  }
  svg.flightpath{position:absolute;inset:0;opacity:0.35;}
  .stamp{
    position:absolute; top:60px; right:70px; width:150px; height:150px;
    border:3px solid #A9824F; border-radius:50%;
    display:flex; align-items:center; justify-content:center; text-align:center;
    transform:rotate(-9deg); opacity:0.9;
    font-family:'Zilla Slab',serif; color:#A9824F; font-size:15px;
    letter-spacing:2px; text-transform:uppercase; line-height:1.5;
  }
  .content{position:relative; z-index:2; padding:90px 100px;}
  .brand{
    display:flex; align-items:center; gap:12px;
    font-family:'Zilla Slab',serif; font-weight:700; font-size:26px; letter-spacing:2px;
    margin-bottom:56px;
  }
  .brand .dot{width:14px;height:14px;border-radius:50%;background:#C8281B;display:inline-block;}
  .eyebrow{
    font-family:'Inter',monospace; font-size:17px; letter-spacing:4px; text-transform:uppercase;
    color:#A9824F; margin-bottom:28px; display:flex; align-items:center; gap:14px;
  }
  .eyebrow::before{content:'';width:40px;height:2px;background:#A9824F;}
  h1{
    font-family:'Zilla Slab','Noto Serif JP',serif; font-weight:600; font-size:88px;
    color:#fff; line-height:1.15; max-width:820px;
  }
  .sub{margin-top:34px; font-size:26px; color:rgba(234,237,242,0.82); max-width:680px;}
</style>
</head>
<body>
  <svg class="flightpath" viewBox="0 0 1200 630" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M-20,520 C 260,460 420,140 660,180 S 1050,420 1250,110" stroke="#A9824F" stroke-width="1.5" fill="none" stroke-dasharray="3 10"/>
    <circle cx="-20" cy="520" r="5" fill="#A9824F"/>
    <circle cx="1250" cy="110" r="5" fill="#C8281B"/>
  </svg>
  <div class="stamp">TORONTO<br>ARRIVAL<br>2026</div>
  <div class="content">
    <div class="brand"><span class="dot"></span>LANDED</div>
    <div class="eyebrow">ワーキングホリデー・トロント上陸サポート</div>
    <h1>勝負は、<br>初日。</h1>
    <div class="sub">SIN・銀行口座・住まいの段取りを、最短で。</div>
  </div>
</body>
</html>
